<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BinTrack</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5d3a">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f5d3a%22/%3E%3Cpath d=%22M16 4.5l9.5 6.5h-19z%22 fill=%22%238a939e%22/%3E%3Crect x=%227%22 y=%2211%22 width=%2218%22 height=%2215%22 fill=%22%23c3cad1%22/%3E%3Cpath d=%22M7 15.5h18M7 20h18M7 24.5h18%22 stroke=%22%2398a1ab%22 stroke-width=%221.2%22/%3E%3Crect x=%225%22 y=%2226%22 width=%2222%22 height=%222.4%22 rx=%221%22 fill=%22%238a939e%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceee6;--panel:#fbfcf8;--ink:#1d2a22;--mute:#5f6d62;--line:#cdd4c3;--accent:#2f5d3a;--accentink:#fff;--map:#d8e0c6;--grid:#c6cfb2;--danger:#a5301f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121813;--panel:#1b241d;--ink:#e5ebe2;--mute:#9aa89c;--line:#2f3b31;--accent:#7fc08a;--accentink:#0f1a11;--map:#222c23;--grid:#2c382d;--danger:#ff8b78}}
:root[data-theme="dark"]{--bg:#121813;--panel:#1b241d;--ink:#e5ebe2;--mute:#9aa89c;--line:#2f3b31;--accent:#7fc08a;--accentink:#0f1a11;--map:#222c23;--grid:#2c382d;--danger:#ff8b78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:700 26px/1 "Barlow Condensed",Barlow,sans-serif;margin:0;letter-spacing:.01em}
.bar{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accentink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:relative}
.farmbar{display:flex;gap:8px;align-items:center;margin-left:auto}
header select{width:auto;max-width:42vw}
.brand{display:flex;align-items:center;gap:10px}
.logo{flex:none;display:block}
.badge{font:600 12px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accentink);border-radius:99px;padding:3px 9px}
#settings{max-height:calc(100vh - 140px);overflow:auto}
.hist ul{margin:4px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
a.btn{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:inherit;text-decoration:none}
.farmctl{display:flex}
.farmctl select{border-radius:6px 0 0 6px;border-right:0}
.farmctl #fedit{border-radius:0 6px 6px 0;font-size:16px;padding:7px 11px}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
#gear,#fedit{font-size:18px;line-height:1;padding:6px 10px}
#settings,#farmpop{position:absolute;right:12px;top:calc(100% + 6px);z-index:30;width:min(320px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
#settings h2,#farmpop h2{font:700 22px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accentink);font-weight:600}
main{display:grid;grid-template-columns:1fr 330px;gap:14px;padding:14px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
#yard{height:70vh;min-height:340px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:100%;display:block;background:var(--map);border:1px solid var(--line);border-radius:8px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
aside h2{font:700 22px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:3px 8px;font-size:14px}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.35);vertical-align:-2px;margin-right:8px}
table{width:100%;border-collapse:collapse}
td{padding:6px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--mute);font-size:14px;margin:12px 0 0}
.warn{color:var(--danger);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
[hidden]{display:none!important}
#photobar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;justify-content:center;pointer-events:none;padding:0 10px 10px}
.pbin{pointer-events:auto;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.28);display:grid;gap:2px}
.pbin button{margin-top:10px}
#sheetwrap{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;pointer-events:none;padding:0 10px 10px}
body{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;border:0;border-radius:0;padding:14px 8px;font-weight:600;color:var(--mute);background:transparent}
#tabs button[aria-pressed=true]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
body[data-view="list"] .bar{display:none}
body[data-mode="home"] aside{display:none}
body[data-mode="home"] main{grid-template-columns:1fr}
#listv{padding:14px;max-width:760px;margin:0 auto}
#listv h2{font:700 22px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 10px}
#listv ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.binrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:10px}
.binrow .sw{grid-row:1/3;margin:0;width:22px;height:22px}
.binrow .bn{font-weight:700;font-size:18px}
.binrow .bc{color:var(--mute);font-size:14px;grid-column:2}
.binrow .bq{grid-row:1/3;grid-column:3;font-variant-numeric:tabular-nums}
#sheet{pointer-events:auto;width:100%;max-width:520px;max-height:66vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
#sheet h2{margin-bottom:0}
body[data-mode="home"] [data-m="layout"]{display:none}
body[data-mode="layout"] [data-m="home"]{display:none}
.foot{position:sticky;bottom:-14px;background:var(--panel);display:flex;gap:8px;justify-content:flex-end;margin:14px 0 -2px;padding:10px 0 2px;border-top:1px solid var(--line)}
.foot button{min-width:96px}
svg text{font-family:Barlow,system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body data-mode="home" data-view="map">
<header>
  <h1 class="brand"><svg class="logo" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BinTrack logo"><rect width="32" height="32" rx="8" fill="#2f5d3a"/><path d="M16 4.5l9.5 6.5h-19z" fill="#8a939e"/><rect x="7" y="11" width="18" height="15" fill="#c3cad1"/><path d="M7 15.5h18M7 20h18M7 24.5h18" stroke="#98a1ab" stroke-width="1.2"/><rect x="5" y="26" width="22" height="2.4" rx="1" fill="#8a939e"/></svg><span id="ttl">BinTrack</span><span class="badge" data-m="layout">Editing</span></h1>
  <div class="farmbar"><div class="farmctl"><select id="farm" aria-label="Farm"></select><button id="fedit" aria-label="Edit farm" aria-expanded="false" aria-controls="farmpop">✎</button></div><button id="gear" aria-label="Settings" aria-expanded="false" aria-controls="settings">⚙</button></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Zoom"><button id="zo" aria-label="Zoom out">&minus;</button><button id="zi" aria-label="Zoom in">+</button><button id="rc" aria-label="Recenter on yard">Recenter</button></div>
    <button id="snap" data-m="layout"></button>
    <button id="lockall" data-m="layout"></button>
    <label style="margin:0" data-m="layout"><input id="bgfile" type="file" accept="image/*" hidden><button id="bgbtn" type="button">Yard photo</button></label>
    <button id="undo" data-m="layout" disabled>Undo move</button><button id="padj" data-m="layout" hidden>Adjust photo</button><input id="addn" data-m="layout" type="number" min="1" max="20" value="1" aria-label="How many bins to add" style="width:64px"><button class="primary" id="add" data-m="layout">Add bin</button>
    <button id="editlayout" data-m="home">Edit layout</button><button id="exitlayout" data-m="layout">Done editing</button>
  </div>
  <div id="settings" role="dialog" aria-label="Settings" hidden>
    <h2>Settings</h2>
    <label>Units</label>
    <div class="seg" role="group" aria-label="Units"><button id="u-bu">Bushels</button><button id="u-t">Tonnes</button></div>
    <label>Screen</label>
    <div class="seg" role="group" aria-label="Screen theme"><button id="th-auto">Auto</button><button id="th-light">Light</button><button id="th-dark">Dark</button></div>
    <label>Backup and reports</label>
    <div class="actions" style="margin-top:4px"><button id="bk-save">Download backup</button><button id="bk-load">Restore backup</button></div>
    <div class="actions" style="margin-top:8px"><button id="rp-csv">Bin report (CSV)</button><button id="rp-print">Printable report</button></div>
    <input id="bk-file" type="file" accept=".json,application/json" hidden>
    <p id="bk-msg" class="hint"></p>
    <div class="actions"><button id="bug-open">Report a bug</button></div>
    <div id="bugbox" hidden>
      <label for="bug-text">What went wrong?</label><textarea id="bug-text" rows="4" placeholder="What did you tap, and what happened?"></textarea>
      <div class="actions"><button id="bug-copy" class="primary">Copy report</button><a id="bug-mail" class="btn" href="#" target="_blank" rel="noopener">Email report</a></div>
      <p id="bug-msg" class="hint"></p>
    </div>
    <div class="actions"><button id="s-close" class="primary">Close</button></div>
  </div>
  <div id="farmpop" role="dialog" aria-label="Edit farm" hidden>
    <h2>Edit farm</h2>
    <label for="s-name">Farm name</label><input id="s-name">
    <div class="actions"><button id="s-rename" class="primary">Change name</button><button id="s-del" class="danger">Delete farm</button></div>
  </div>
</header>
<main>
  <svg id="yard" role="img" aria-label="Yard map of grain bins"><g id="gridg"></g><g id="bgg"></g><g id="binsg"></g></svg>
  <aside id="panel"></aside>
</main>
<section id="listv" hidden aria-label="Bin overview"></section>
<nav id="tabs" aria-label="Views"><button id="t-map" aria-pressed="true">Map</button><button id="t-list" aria-pressed="false">Bins</button></nav>
<div id="photobar" hidden><div class="pbin"><strong>Adjust photo</strong><span class="hint" style="margin:0">Drag the map to move it</span>
<label>Size: <span id="pb-sl"></span>%<input id="pb-s" type="range" min="20" max="500"></label>
<label>Opacity<input id="pb-o" type="range" min="10" max="100"></label>
<button id="pb-done" class="primary">Done</button></div></div>
<div id="sheetwrap" hidden><div id="sheet" role="dialog" aria-label="Edit bin"></div></div>
<script>
const CROPS={Wheat:[60,'#e3b23c'],Durum:[60,'#c98a3b'],Canola:[50,'#efd53a'],Barley:[48,'#d6bf8a'],Oats:[34,'#cfcaa8'],Peas:[60,'#93c46c'],Lentils:[60,'#e08e6c'],Flax:[56,'#85abd0'],Soybeans:[60,'#b8c768'],Corn:[56,'#f2b95c'],Other:[60,'#bba7cc']};
const EMPTY='#e8eae3',SNAP=30,G=30,LB_T=2204.62,KEY='binyard.v1',W=1000,H=640;
const SIZES=[1000,2000,3000,5000,7500,10000,15000,30000];
const def=()=>({unit:'bu',snap:true,farm:1,farms:[{id:1,name:'Farm 1',bg:null,view:{x:-40,y:-40,z:1},bins:[
 {id:1,name:'Bin 1',type:'hopper',cap:5000,x:200,y:200,locked:false,crop:'Wheat',qty:4200,variety:'',grade:'',notes:''},
 {id:2,name:'Bin 2',type:'round',cap:3000,x:380,y:200,locked:false,crop:'Canola',qty:3000,variety:'',grade:'',notes:''},
 {id:3,name:'Bin 3',type:'round',cap:10000,x:300,y:410,locked:false,crop:'',qty:0,variety:'',grade:'',notes:''}]}]});
let S;try{const o=JSON.parse(localStorage.getItem(KEY));
 if(o&&o.farms)S=o;else if(o&&o.bins)S={unit:o.unit,snap:o.snap,farm:1,farms:[{id:1,name:'Farm 1',bg:o.bg||null,bins:o.bins,view:{x:-40,y:-40,z:1}}]};else S=def()}catch(e){S=def()}
const F=()=>S.farms.find(f=>f.id===S.farm)||S.farms[0];
let selId=null,drag=null,confirmDel=false,mode='home',view='map',sheetId=null,orig=null,isNew=null,tap=null,undoS=[],cropFilter='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id), svg=$('yard');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wt=c=>CROPS[c]?CROPS[c][0]:60;
const toU=(bu,c)=>S.unit==='bu'?bu:bu*wt(c)/LB_T;
const fromU=(v,c)=>S.unit==='bu'?v:v*LB_T/wt(c);
const fmt=(bu,c)=>toU(bu,c).toLocaleString(undefined,{maximumFractionDigits:S.unit==='bu'?0:1})+(S.unit==='bu'?' bu':' t');
const num=v=>Math.round(v*100)/100;
const rad=b=>10+Math.sqrt(b.cap)*.45;
const col=b=>b.crop&&CROPS[b.crop]?CROPS[b.crop][1]:EMPTY;
const sel=()=>F().bins.find(b=>b.id===selId);

function draw(){
  let h='';
  F().bins.forEach(b=>{
    const r=rad(b),z=V().z,fs=Math.max(Math.max(15,Math.min(24,r*.42)),Math.min(12/z,r*.6));
    const lines=[b.name,b.crop||'Empty'];
    const sz=lines.map((t,i)=>Math.max(8,Math.min(i?fs*.85:fs,(2*r*.84)/(Math.max(3,t.length)*.56))));
    const tot=sz.reduce((a,x)=>a+x*1.2,0);let yy=-tot/2;
    const ys=sz.map(x=>{const y=yy+x*.6;yy+=x*1.2;return y});
    h+=`<g data-id="${b.id}" transform="translate(${b.x},${b.y})" style="cursor:${mode==='layout'&&!b.locked?'grab':'pointer'};opacity:${match(b)?1:.25}">`;
    h+=`<circle class="ring" r="${r+8}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 5" display="${b.id===selId?'inline':'none'}"/>`;
    h+=`<circle r="${r}" fill="${col(b)}" stroke="#7d8793" stroke-width="4"/>`;
    if(b.type==='hopper')h+=`<circle r="${r*.58}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="2" stroke-dasharray="4 3"/>`;
    lines.forEach((t,i)=>h+=`<text y="${ys[i]}" text-anchor="middle" dominant-baseline="middle" font-size="${sz[i]}" font-weight="${i?600:700}" fill="#101810" stroke="rgba(255,255,255,.9)" stroke-width="${sz[i]*.3}" stroke-linejoin="round" paint-order="stroke">${esc(t)}</text>`);
    if(mode==='layout'&&b.locked)h+=`<text x="${r*.72}" y="${-r*.72}" font-size="15" text-anchor="middle" dominant-baseline="middle">🔒</text>`;
    h+='</g>';
  });
  binsg.innerHTML=h;
  drawBg();
  const all=F().bins.length&&F().bins.every(b=>b.locked);
  $('lockall').textContent=all?'Unlock all':'Lock all';
  $('snap').textContent='Snap to grid: '+(S.snap!==false?'On':'Off');
  $('u-bu').setAttribute('aria-pressed',S.unit==='bu');$('u-t').setAttribute('aria-pressed',S.unit==='t');
  if(view==='list')drawList();
  updatePhotoUI();
  $('undo').disabled=!undoS.some(u=>u.fid===S.farm);
  $('bgbtn').textContent=F().bg?'Change yard photo':'Yard photo';
}

function panel(){
  const b=F().bins.find(x=>x.id===sheetId),show=!!b,p=show?$('sheet'):$('panel');confirmDel=false;
  $('sheetwrap').hidden=!show;
  if(!show){
    p.innerHTML=`<h2>Edit layout</h2><p class="hint">Drag an unlocked bin to place it, then lock it. Tap a bin to rename, resize, lock or remove it. Drag empty space to move around the map.</p>${photoHtml()}`;
    photoBind();
    return;
  }
  const c=b.crop||'Wheat',over=b.qty>b.cap;
  p.innerHTML=`<h2>${esc(b.name)}</h2>
  <div data-m="layout"><label for="f-name">Bin name</label><input id="f-name" value="${esc(b.name)}">
  <div class="row"><div><label for="f-type">Type</label><select id="f-type"><option value="round">Flat bottom</option><option value="hopper">Hopper bottom</option></select></div>
  <div><label for="f-cap">Capacity (${S.unit==='bu'?'bu':'t'})</label><input id="f-cap" type="number" min="1" step="any" value="${num(toU(b.cap,c))}"></div></div>
  <div class="chips">${SIZES.map(s=>`<button data-size="${s}">${s.toLocaleString()} bu</button>`).join('')}</div>
  <div class="actions"><button id="f-lock">${b.locked?'Unlock position':'Lock position'}</button><button id="f-copy">Copy bin</button><button id="f-del" class="danger">Remove bin</button></div></div>
  <div><div><label for="f-crop">Crop</label><select id="f-crop"><option value="">Empty</option>${Object.keys(CROPS).map(k=>`<option>${k}</option>`).join('')}</select></div>
  <div class="row"><div><label for="f-var">Variety</label><input id="f-var" value="${esc(b.variety)}"></div><div><label for="f-grade">Grade</label><input id="f-grade" value="${esc(b.grade)}"></div></div>
  <label for="f-notes">Notes</label><textarea id="f-notes" rows="3">${esc(b.notes)}</textarea>
  <div class="actions"><button id="f-empty">Empty bin</button></div>
  <div class="hist"><label>Last updated: ${b.upd?fmtDate(b.upd):'never'}</label>${(b.hist||[]).length?'<ul>'+b.hist.slice(0,5).map(h=>`<li>${fmtDate(h.t)}: ${esc(h.x)}</li>`).join('')+'</ul>':''}</div></div>
  <div class="foot"><button id="f-cancel">Cancel</button><button id="f-done" class="primary">Done</button></div>`;
  $('f-type').value=b.type;$('f-crop').value=b.crop||'';
  const on=(id,fn,ev='input')=>$(id).addEventListener(ev,fn);
  const upd=()=>{touch(b);save();draw()};
  on('f-name',e=>{b.name=e.target.value;upd();p.querySelector('h2').textContent=b.name});
  on('f-type',e=>{b.type=e.target.value;upd()},'change');
  on('f-crop',e=>{const o=b.crop||'Empty';b.crop=e.target.value;touch(b,'Crop: '+o+' to '+(b.crop||'Empty'));save();draw();panel()},'change');
  on('f-cap',e=>{b.cap=Math.max(1,fromU(+e.target.value||1,c));upd()});
  p.querySelectorAll('[data-size]').forEach(x=>x.onclick=()=>{b.cap=+x.dataset.size;save();draw();panel()});
  on('f-var',e=>{b.variety=e.target.value;touch(b);save()});on('f-grade',e=>{b.grade=e.target.value;touch(b);save()});on('f-notes',e=>{b.notes=e.target.value;touch(b);save()});
  $('f-copy').onclick=()=>{const id=Math.max(0,...F().bins.map(x=>x.id))+1;F().bins.push({...JSON.parse(JSON.stringify(b)),id,name:b.name+' copy',x:b.x+2*G,y:b.y+2*G,locked:false,hist:[],upd:Date.now()});save();openBin(id,true)};
  $('f-lock').onclick=()=>{b.locked=!b.locked;save();draw();panel()};
  $('f-empty').onclick=()=>{touch(b,'Emptied (was '+(b.crop||'Empty')+')');b.crop='';b.qty=0;b.variety='';b.grade='';save();draw();panel()};
  const shut=()=>{sheetId=null;selId=null;isNew=null;orig=null;save();draw();panel()};
  $('f-done').onclick=shut;
  $('f-cancel').onclick=()=>{

    $('addn').value=1;save();draw();return}
  const id=Math.max(0,...F().bins.map(b=>b.id))+1;
  F().bins.push({id,name:'Bin '+id,type:'round',cap:3000,x:Math.round((V().x+svg.clientWidth/V().z/2)/G)*G,y:Math.round((V().y+svg.clientHeight/V().z/2)/G)*G,locked:false,crop:'',qty:0,variety:'',grade:'',notes:''});
  save();openBin(id,true);
};
$('snap').onclick=()=>{S.snap=S.snap===false;save();draw();if(selId)panel()};
$('lockall').onclick=()=>{const all=F().bins.every(b=>b.locked);F().bins.forEach(b=>b.locked=!all);save();draw();if(selId)panel()};
const setU=u=>{S.unit=u;save();draw();panel()};
$('u-bu').onclick=()=>setU('bu');$('u-t').onclick=()=>setU('t');
$('bgbtn').onclick=()=>$('bgfile').click();
$('bgfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{F().bg=r.result;F().bgp=null;photoMode=false;save();draw();panel()};r.readAsDataURL(f);
};
applyTheme();fillFarms();setView();draw();panel();window.addEventListener('resize',setView);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
